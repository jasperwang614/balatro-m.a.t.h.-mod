name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod zip
        run: |
          mkdir -p unproven
          cp -r items localization assets main.lua unproven.json README.md .gitignore unproven/
          zip -r "unproven-${GITHUB_REF_NAME}.zip" unproven

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "unproven-*.zip"
          body: |
            # 未证之牌 UNPROVEN（数学主题 Balatro Mod）

            v1.4.2：56 张小丑 + 6 张消耗牌 + 4 张优惠券链 + 质数牌组 + 8 个成就 + Boss 盲注《七桥问题》+ 体验挑战《未证之旅》+ 数学小丑包 + 5 张定制卡面。

            ## 亮点
            - 招牌：页边太窄（隐藏条件）、e（核弹）、蛰伏七年（期满一次性发放 5 张负片传奇 + 8 张负片消耗牌）
            - 中国数学长廊：陈景润 1+2（哥德巴赫联动）、G2 in box（鸡兔同笼）、高斯求和
            - 数学家线：毕达哥拉斯（点数平方筹码）、黎曼（积分累加）、庞加莱（佩雷尔曼联动）、哥德尔（自指倍率）、希尔伯特旅馆（手牌上限 +2）、菲尔兹奖（数学家计数引擎）
            - 计算机与机器线：冯·诺依曼（自复制到 29 张 + 29 状态词条 + 永久叠加）、阿达·洛芙莱斯（X(1.01)^M 联动）、EDVAC（存储程序）、Attention Is All You Need（自注意力 O(n²)）
            - 传承链：约率 → 密率、√2 → 无理数时代、决斗前夜 → 群论（消亡换新生）
            - 对手戏：牛顿 vs 莱布尼茨（互减）、伯努利家族（一门八杰按 8 位数学家计入菲尔兹奖）
            - 谜卡：1984 / 1Q84——老大哥正在看着你
            - 传说小丑 Kun：练习时长两年半——计分牌含 2 和 5 或单出 K 练习，永久 X2.5 叠加，所有计分手牌吃到当前倍率；与 G2 in box 同场触发"鸡你太美"彩蛋
            - 定制卡面 +3：冯·诺依曼、阿达·洛芙莱斯、Kun（图集共 5 张）
            - 成就系统 8 个 + 质数牌组 + 格林-陶定理 + 四书优惠券链（几何原本 → 算术研究 → 数学原理 → GEB）
            - 上手导览：挑战《未证之旅》直接开玩；数学小丑包 3 选 1 / 5 选 2 只出数学卡
            - 全卡中英双语文案

            ## 安装
            依赖 Lovely + Steamodded (SMODS) 1.0+，解压 `unproven` 文件夹到 `%APPDATA%/Balatro/Mods/`。

            ## 已知事项
            - 定制卡面已启用 5 张（菲尔兹奖、卡拉比-丘流形、冯·诺依曼、阿达·洛芙莱斯、Kun），其余为原版占位，欢迎投稿
            - 部分数值为草案，整局平衡待后续版本
            - 后续 v1.5 大更新：中国数学长廊、对偶版、更多卡面等排期中
