name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod zip
        run: |
          mkdir -p unproven
          cp -r items localization assets main.lua unproven.json README.md .gitignore unproven/
          zip -r "unproven-${GITHUB_REF_NAME}.zip" unproven

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "unproven-*.zip"
          body: |
            # 未证之牌 UNPROVEN（数学主题 Balatro Mod）

            v1.0.0 正式版：42 张小丑 + 5 张消耗牌（悖论 3 + 幻灵 2）+ Boss 盲注《七桥问题》+ 体验挑战《未证之旅》+ 数学小丑包。

            ## 亮点
            - 招牌：页边太窄（隐藏条件）、e（核弹）、蛰伏七年（期满一次性发放 5 张负片传奇 + 8 张负片消耗牌）
            - 中国数学长廊：陈景润 1+2（哥德巴赫联动）、G2 in box（鸡兔同笼）、高斯求和
            - 数学家线：毕达哥拉斯（点数平方筹码）、黎曼（积分累加）、庞加莱（佩雷尔曼联动）、哥德尔（自指倍率）、希尔伯特旅馆（手牌上限 +2）、菲尔兹奖（数学家计数引擎）
            - v1 收尾三件：巴拿赫-塔斯基（1 张变 2 张复制）、罗素的信（指定小丑失效）、七桥问题（花色只能计分一次）
            - 上手导览：挑战《未证之旅》直接开玩；数学小丑包 3 选 1 / 5 选 2 只出数学卡
            - 全卡中英双语文案

            ## 安装
            依赖 Lovely + Steamodded (SMODS) 1.0+，解压 `unproven` 文件夹到 `%APPDATA%/Balatro/Mods/`。

            ## 已知事项
            - 美术为原版占位，欢迎投稿（见 README《美术占位征集》，仓库含空白模板）
            - 部分数值为草案，整局平衡待后续版本
            - 后续 v1.5 补遗：传承链、牛顿/莱布尼茨、质数牌组、对偶版等排期中
